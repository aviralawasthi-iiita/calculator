<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator with History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Calculator with History</h1>
  <a href="index.html"></a>
</header>

<div class="container">
  <div class="calculator">
    <input type="text" id="display" disabled>
    
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('*')">x</button>
      <button onclick="deleteLast()">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="calculateResult()">=</button>

      <button onclick="appendValue('0')" class="zero">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>

  
  <div class="history">
    <h2>History</h2>
    <ul id="history-list"></ul>
    <button onclick="clearHistory()" class="clear-history-btn">Clear History</button>
  </div>
</div>

<footer>
  <p>&copy; 2025 Radhika Vaish. All rights reserved.</p>
</footer>

<script src="java.js"></script>

</body>
</html>
